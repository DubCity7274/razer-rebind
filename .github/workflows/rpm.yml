# Builds the RPM on every push and pull request (download it from the run's
# "Artifacts"). Pushing a tag like v0.3.0 also publishes a GitHub Release with
# the RPMs attached; the tag must match Version: in the spec.
name: RPM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: Build RPM (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    strategy:
      matrix:
        fedora: ['44']
    steps:
      # git must exist before checkout, or actions/checkout falls back to a
      # tarball without history and `git archive` can't run.
      - name: Install build tools
        run: dnf -y install git rpm-build 'dnf-command(builddep)'

      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: dnf -y builddep packaging/razer-rebind.spec

      - name: Check that the tag matches the spec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^Version: *//p' packaging/razer-rebind.spec)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Version: $version in packaging/razer-rebind.spec"
            exit 1
          fi

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./packaging/build-rpm.sh --direct

      - uses: actions/upload-artifact@v7
        with:
          name: razer-rebind-fedora-${{ matrix.fedora }}
          path: |
            dist/*.rpm
            !dist/*-debuginfo-*.rpm
            !dist/*-debugsource-*.rpm
          if-no-files-found: error

  release:
    name: Publish release
    needs: rpm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.rpm \
            --repo "$GITHUB_REPOSITORY" \
            --title "Razer Rebind ${GITHUB_REF_NAME#v}" \
            --generate-notes
